<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Role 2 · Cabin and EVA</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#071218; }
    canvas { display:block; width:100%; height:100%; }
    nav { position:absolute; top:70px; right:48px; display:flex; gap:6px; z-index:2; }
    button { background:#0b2029; color:#c0e8e6; border:1px solid #4b7b80; padding:7px 10px; cursor:pointer; }
    button[aria-pressed=true] { color:#8ff2d9; border-color:#8ff2d9; }
    #message { position:absolute; right:48px; top:115px; max-width:300px; color:#b6d8d7; font:11px monospace; pointer-events:none; }
    #error { position:absolute; left:25%; top:35%; color:#ffb988; font:16px monospace; }
  </style>
  
</head>
<body>
  <nav aria-label="Walk debug controls"></nav>
  <div id="message" role="status"></div>
  <div id="error" role="alert"></div>
  <script type="module" src="./role2-walk.js"></script>
</body>
</html>
